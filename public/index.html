
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>👾 R.E.T.R.O. v2.0 | Entertainment Recommender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="crt-enabled">
  <!-- Subtle CRT Scanline & Vignette Overlay -->
  <div class="crt-overlay"></div>
  <div class="crt-vignette"></div>

  <!-- Top Arcade Header & Navigation -->
  <header class="retro-header">
    <div class="header-top-bar">
      <div class="arcade-status">
        <span class="status-dot"></span>
        <span>SYS.ONLINE // 60FPS</span>
      </div>
      <span class="arcade-badge blink-pulse">🪙 INSERT COIN // 1UP</span>
      <div class="header-toggles">
        <button id="sfx-toggle-btn" class="crt-toggle" title="Toggle 8-Bit Arcade Audio">🔊 SFX: ON</button>
        <button id="crt-toggle-btn" class="crt-toggle" title="Toggle CRT Scanlines">📺 CRT FX: ON</button>
      </div>
    </div>

    <div class="brand">
      <h1><span class="brand-icon">👾</span> R.E.T.R.O.</h1>
      <p>Recommendation Engine for Tailored Recreation &amp; Online-content</p>
    </div>

    <nav class="retro-nav" id="main-nav" aria-label="Main Navigation">
      <button class="nav-btn active" data-view="home">🏠 HOME</button>
      <button class="nav-btn" data-view="videos">📺 YT VIDEOS</button>
      <button class="nav-btn" data-view="music">🎵 YT MUSIC</button>
      <button class="nav-btn" data-view="movies">🎬 MOVIES</button>
      <button class="nav-btn" data-view="tv">📺 TV SHOWS</button>
      <button class="nav-btn" data-view="anime">⛩️ ANIME</button>
      <button class="nav-btn" data-view="games">🎮 GAMES</button>
    </nav>
  </header>

  <!-- Main Workspace -->
  <main class="container">
    <!-- Global Preferences Bar (Shown on Video, Music, Movie, Anime, and Game Views) -->
    <section id="preferences-panel" class="retro-panel hidden">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <span class="led-indicator"></span>
          <h2>⚡ PLAYER PREFERENCES</h2>
        </div>
        <div class="panel-actions">
          <button id="clear-profile-btn" class="btn-secondary btn-sm">🧠 CLEAR TASTE PROFILE</button>
          <button id="reset-btn" class="btn-secondary btn-sm">↺ RESET MEMORY</button>
        </div>
      </div>

      <!-- Compact ASK R.E.T.R.O. AI Bar on every tab -->
      <div class="ai-compact-bar">
        <span class="ai-badge">🤖 ASK R.E.T.R.O.</span>
        <input
          type="text"
          id="tab-ai-prompt"
          class="retro-input ai-input"
          placeholder="Tell me how you feel or what you want... (e.g. chill Tamil melody songs or sci-fi thriller)"
        />
        <button id="tab-ai-submit-btn" class="btn-primary btn-sm">ASK AI ⚡</button>
      </div>

      <div class="pref-grid">
        <!-- Dynamic Slot 1: Mood (Videos/Music) OR Genre (Movies) -->
        <div class="control-group" id="mood-group">
          <label for="mood-select">EMOTIONAL STATE (MOOD)</label>
          <select id="mood-select" class="retro-input">
            <option value="Happy">😄 Happy</option>
            <option value="Sad">😢 Sad</option>
            <option value="Energetic">⚡ Energetic</option>
            <option value="Relaxed">☕ Relaxed</option>
            <option value="Stressed">🤯 Stressed</option>
            <option value="Bored">🥱 Bored</option>
            <option value="Adventurous">🗺️ Adventurous</option>
          </select>
        </div>

        <div class="control-group hidden" id="genre-group">
          <label for="genre-select">MOVIE GENRE</label>
          <select id="genre-select" class="retro-input">
            <option value="28">💥 Action</option>
            <option value="35">😂 Comedy</option>
            <option value="18">🎭 Drama</option>
            <option value="10751">👨‍👩‍👧‍👦 Family</option>
            <option value="27">👻 Horror</option>
            <option value="10749">💖 Romance</option>
            <option value="878">🛸 Science Fiction</option>
            <option value="16">🎨 Animation</option>
          </select>
        </div>

        <div class="control-group hidden" id="tv-genre-group">
          <label for="tv-genre">TV GENRE</label>
          <select id="tv-genre" class="retro-input">
            <option value="">Any Genre</option><option value="10759">Action &amp; Adventure</option><option value="35">Comedy</option>
            <option value="80">Crime</option><option value="18" selected>Drama</option>
            <option value="10751">Family</option><option value="10762">Kids</option>
            <option value="9648">Mystery</option><option value="10765">Sci-Fi &amp; Fantasy</option>
            <option value="99">Documentary</option><option value="10764">Reality</option><option value="16">Animation</option>
          </select>
        </div>
        <div class="control-group hidden" id="tv-mode-group">
          <label for="tv-mode">DISCOVERY MODE</label>
          <select id="tv-mode" class="retro-input">
            <option value="popular">Popular</option><option value="top">Top Rated</option>
            <option value="airing">Airing Now</option><option value="new">New Releases</option>
          </select>
        </div>

        <!-- Slot 2: Anime Controls -->
        <div class="control-group hidden" id="anime-mode-group">
          <label for="anime-mode">DISCOVERY MODE</label>
          <select id="anime-mode" class="retro-input">
            <option value="genre">🎯 Genre &amp; Rating Based</option>
            <option value="seasonal">🌸 Seasonal Anime</option>
            <option value="top">🏆 Top Ranked Anime</option>
          </select>
        </div>

        <div class="control-group hidden" id="anime-genre-group">
          <label for="anime-genre">ANIME GENRE</label>
          <select id="anime-genre" class="retro-input">
            <option value="Action">💥 Action</option>
            <option value="Adventure">🗺️ Adventure</option>
            <option value="Comedy">😂 Comedy</option>
            <option value="Drama">🎭 Drama</option>
            <option value="Fantasy">🧙 Fantasy</option>
            <option value="Romance">💖 Romance</option>
            <option value="Sci-Fi">🛸 Sci-Fi</option>
            <option value="Mystery">🔍 Mystery</option>
          </select>
        </div>

        <div class="control-group hidden" id="anime-rating-group">
          <label for="anime-rating">CONTENT RATING</label>
          <select id="anime-rating" class="retro-input">
            <option value="g">G - All Ages</option>
            <option value="pg">PG - Children</option>
            <option value="pg13" selected>PG-13 - Teens 13+</option>
            <option value="r17">R - 17+ (Violence/Profanity)</option>
          </select>
        </div>

        <div class="control-group hidden" id="anime-season-group">
          <label for="anime-season">SEASON</label>
          <select id="anime-season" class="retro-input">
            <option value="winter">❄️ Winter</option>
            <option value="spring">🌸 Spring</option>
            <option value="summer">☀️ Summer</option>
            <option value="fall">🍂 Fall</option>
          </select>
        </div>

        <div class="control-group hidden" id="anime-year-group">
          <label for="anime-year">SEASON YEAR</label>
          <input type="number" id="anime-year" class="retro-input" min="1970" max="2035" value="2026" />
        </div>

        <!-- Slot 3: Game Controls -->
        <div class="control-group hidden" id="game-mode-group">
          <label for="game-mode">DISCOVERY MODE</label>
          <select id="game-mode" class="retro-input">
            <option value="recommended">🏆 Recommended (Top Rated)</option>
            <option value="upcoming">⏳ Upcoming Releases (Next 6 Mo)</option>
          </select>
        </div>

        <div class="control-group hidden" id="game-platform-group">
          <label for="game-platform">PLATFORM</label>
          <select id="game-platform" class="retro-input">
            <option value="">🌐 All Platforms</option>
            <option value="4" selected>💻 PC</option>
            <option value="187">🎮 PlayStation 5</option>
            <option value="18">🎮 PlayStation 4</option>
            <option value="186">🟢 Xbox Series S/X</option>
            <option value="7">🔴 Nintendo Switch</option>
            <option value="21">📱 Android</option>
            <option value="3">🍎 iOS</option>
          </select>
        </div>

        <div class="control-group hidden" id="game-genre-group">
          <label for="game-genre">GAME GENRE</label>
          <select id="game-genre" class="retro-input">
            <option value="">🎯 All Genres</option>
            <option value="action" selected>💥 Action</option>
            <option value="adventure">🗺️ Adventure</option>
            <option value="role-playing-games-rpg">🧙 RPG</option>
            <option value="shooter">🎯 Shooter</option>
            <option value="puzzle">🧩 Puzzle</option>
            <option value="racing">🏎️ Racing</option>
            <option value="sports">⚽ Sports</option>
            <option value="strategy">♟️ Strategy</option>
            <option value="indie">🕹️ Indie</option>
          </select>
        </div>

        <!-- Common: Player Age Slider (Videos, Music, Movies, Games) -->
        <div class="control-group" id="age-group">
          <label for="age-slider">
            <span>PLAYER AGE: <strong id="age-value" class="neon-text">18</strong></span>
            <span id="age-badge" class="badge">TEENS</span>
          </label>
          <div class="slider-wrap">
            <input type="range" id="age-slider" min="1" max="100" value="18" class="retro-slider" />
            <div class="slider-ticks">
              <span>1</span>
              <span>12</span>
              <span>19</span>
              <span>50</span>
              <span>100</span>
            </div>
          </div>
        </div>

        <!-- Common: Audio / Subtitle Language (Videos, Music, Movies) -->
        <div class="control-group" id="language-group">
          <label for="language-select">AUDIO / SUBTITLE LANGUAGE</label>
          <select id="language-select" class="retro-input">
            <option value="English">English</option>
            <option value="Tamil">Tamil (தமிழ்)</option>
            <option value="Hindi">Hindi (हिन्दी)</option>
            <option value="Telugu">Telugu (తెలుగు)</option>
            <option value="Malayalam">Malayalam (മലയാളം)</option>
            <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
          </select>
        </div>
      </div>

      <div class="action-row">
        <button id="fetch-action-btn" class="btn-primary">🚀 GENERATE RECOMMENDATION</button>
        <button id="surprise-btn" class="btn-surprise">🎲 SURPRISE ME</button>
      </div>
    </section>

    <!-- Dynamic View Container -->
    <section id="view-outlet"></section>
  </main>

  <footer class="retro-footer">
    <div class="footer-inner">
      <span>R.E.T.R.O. SYSTEM v2.0 // SYNTHWAVE ARCADE OS</span>
      <span class="footer-sep">•</span>
      <span>POWERED BY TYPESCRIPT, GEMINI FLASH &amp; EXPRESS</span>
    </div>
  </footer>

  <script src="/dist/app.js"></script>
</body>
</html>
